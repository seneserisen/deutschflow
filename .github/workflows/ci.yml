name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up project (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/setup.sh

      - name: Verify project (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/test.sh

      - name: Set up project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Verify project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test.ps1
